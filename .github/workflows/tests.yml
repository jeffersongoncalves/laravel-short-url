name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json/composer.lock already pin the supported PHP/Laravel
        # combo (PHP 8.4, Laravel 13) — this only needs to vary by database
        # to catch driver-specific SQL differences. Pint and PHPStan run in
        # their own dedicated workflows, not repeated here per database.
        database: [sqlite, mysql, pgsql]

    name: Tests - ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3

      - name: Run Tests (sqlite)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pest

      - name: Run Tests (mysql)
        if: matrix.database == 'mysql'
        env:
          SHORT_URL_TEST_DB_DRIVER: mysql
          SHORT_URL_TEST_DB_HOST: 127.0.0.1
          SHORT_URL_TEST_DB_PORT: 3306
          SHORT_URL_TEST_DB_DATABASE: testing
          SHORT_URL_TEST_DB_USERNAME: root
          SHORT_URL_TEST_DB_PASSWORD: ''
        run: vendor/bin/pest

      - name: Run Tests (pgsql)
        if: matrix.database == 'pgsql'
        env:
          SHORT_URL_TEST_DB_DRIVER: pgsql
          SHORT_URL_TEST_DB_HOST: 127.0.0.1
          SHORT_URL_TEST_DB_PORT: 5432
          SHORT_URL_TEST_DB_DATABASE: testing
          SHORT_URL_TEST_DB_USERNAME: postgres
          SHORT_URL_TEST_DB_PASSWORD: postgres
        run: vendor/bin/pest
