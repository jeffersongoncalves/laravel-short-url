openapi: 3.0.3
info:
  title: laravel-short-url API
  description: >
    REST API for jeffersongoncalves/laravel-short-url. Disabled by default
    (short-url.api.enabled). All routes are namespaced under
    short-url.api.prefix (default /api/short-url/v1) and require a Bearer
    API key (short_url_api_keys) with the listed ability.
  version: "1.0.0"
servers:
  - url: /api/short-url/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token issued via ApiKey::generate(). Each key carries an abilities list (e.g. links:read, links:write, conversions:write, or * for all).
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    ShortUrl:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url_key:
          type: string
        destination_url:
          type: string
        destination_type:
          type: string
          enum: [single, split, rules]
        title:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        is_enabled:
          type: boolean
        redirect_status_code:
          type: integer
        single_use:
          type: boolean
        max_visits:
          type: integer
          nullable: true
        total_visits:
          type: integer
        unique_visits:
          type: integer
        qr_scans:
          type: integer
        bot_visits:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
        has_password:
          type: boolean
        safe_browsing_status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  responses:
    Unauthorized:
      description: Missing, invalid, revoked or expired API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The key is missing a required ability.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (or the API is disabled on this installation).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object }
    TooManyRequests:
      description: Per-API-key rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: The application is in maintenance mode.
paths:
  /links:
    get:
      summary: List links
      security: [{ bearerAuth: [links:read] }]
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, maximum: 100, default: 25 }
        - name: enabled
          in: query
          schema: { type: boolean }
        - name: with_trashed
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated list of links.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ShortUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      summary: Create a link
      security: [{ bearerAuth: [links:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination_url]
              properties:
                destination_url: { type: string, format: uri }
                url_key: { type: string, nullable: true }
                title: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                is_enabled: { type: boolean }
                expires_at: { type: string, format: date-time, nullable: true }
                max_visits: { type: integer, nullable: true }
                password: { type: string, nullable: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ShortUrl' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /links/bulk:
    post:
      summary: Bulk-create up to 500 links
      security: [{ bearerAuth: [links:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [destination_url]
                    properties:
                      destination_url: { type: string, format: uri }
                      url_key: { type: string, nullable: true }
                      title: { type: string, nullable: true }
      responses:
        '201':
          description: Created links plus any per-row errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ShortUrl' }
                  errors:
                    type: array
                    items:
                      type: object
                      properties: { index: { type: integer }, message: { type: string } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /links/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Show a link
      security: [{ bearerAuth: [links:read] }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/ShortUrl' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a link
      security: [{ bearerAuth: [links:write] }]
      responses:
        '200': { description: Updated. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Soft-delete a link
      security: [{ bearerAuth: [links:write] }]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /links/{uuid}/restore:
    post:
      summary: Restore a soft-deleted link
      security: [{ bearerAuth: [links:write] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Restored. }
        '404': { $ref: '#/components/responses/NotFound' }
  /links/{uuid}/stats:
    get:
      summary: Aggregated stats for a link (merges daily_stats history with today's live visits)
      security: [{ bearerAuth: [links:read] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK. }
        '404': { $ref: '#/components/responses/NotFound' }
  /links/{uuid}/visits:
    get:
      summary: Raw visit rows for a link
      security: [{ bearerAuth: [links:read] }]
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: country_code
          in: query
          schema: { type: string }
        - name: device_type
          in: query
          schema: { type: string }
        - name: is_bot
          in: query
          schema: { type: boolean }
        - name: is_qr_scan
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: OK. }
        '404': { $ref: '#/components/responses/NotFound' }
  /export/csv:
    get:
      summary: Download a CSV export of every link
      security: [{ bearerAuth: [links:read] }]
      responses:
        '200':
          description: CSV file.
          content:
            text/csv:
              schema: { type: string }
  /domains:
    get:
      summary: List custom domains
      security: [{ bearerAuth: [links:read] }]
      responses:
        '200': { description: OK. }
    post:
      summary: Register a custom domain (queues DNS verification)
      security: [{ bearerAuth: [links:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                is_wildcard: { type: boolean }
                root_redirect_url: { type: string, nullable: true }
      responses:
        '201': { description: Created. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /webhooks:
    get:
      summary: List webhooks
      security: [{ bearerAuth: [links:read] }]
      responses:
        '200': { description: OK. }
    post:
      summary: Create a webhook
      security: [{ bearerAuth: [links:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                short_url_id: { type: integer, nullable: true, description: "Omit for a global webhook fired for every link's selected events." }
                url: { type: string, format: uri }
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - "*"
                      - link.created
                      - link.updated
                      - link.deleted
                      - link.visited
                      - link.expired
                      - link.limit_reached
                      - link.unsafe_detected
                      - domain.verified
                      - domain.failed
                      - conversion.recorded
                      - alert.triggered
      responses:
        '201': { description: Created. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /webhooks/{id}:
    delete:
      summary: Delete a webhook
      security: [{ bearerAuth: [links:write] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhook-deliveries/{id}/replay:
    post:
      summary: Re-send a previous webhook delivery attempt
      security: [{ bearerAuth: [links:write] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '202': { description: Replay queued. }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversions:
    post:
      summary: Record a conversion (optionally forwarded server-to-server)
      security: [{ bearerAuth: [conversions:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_name]
              properties:
                url_key: { type: string, description: "Required if short_url_uuid is omitted." }
                short_url_uuid: { type: string, format: uuid, description: "Required if url_key is omitted." }
                event_name: { type: string }
                value: { type: number, nullable: true }
                currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
                external_id: { type: string, nullable: true }
                metadata: { type: object, nullable: true }
                occurred_at: { type: string, format: date-time, nullable: true }
      responses:
        '201': { description: Recorded. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
